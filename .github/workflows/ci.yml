name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Type-check and build
        run: npm run build
        working-directory: web
      - name: Bundle budget
        run: npm run budget
        working-directory: web
      - name: Verify the offline pack is in the build
        run: |
          test -f web/dist/index.html
          test -f web/dist/sw.js
          test -f web/dist/favicon.svg
          test -f server/cue/data/show.json

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./server[dev]"
      - name: Lint
        run: ruff check server
      - name: Tests
        run: pytest -q
        working-directory: server

  pack-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Export the pack and compare
        run: |
          cp ../server/cue/data/show.json /tmp/show.json
          npm run pack
          diff -u /tmp/show.json ../server/cue/data/show.json
        working-directory: web
