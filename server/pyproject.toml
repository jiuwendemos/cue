[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cue"
version = "1.0.0"
description = "CUE — the live show design studio. On-site API, show store and deterministic agent."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["cue*", "laix_attention*", "laix_integration*"]

[tool.setuptools.package-data]
cue = ["data/*.json"]
laix_attention = ["contract/*.json", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: calls a real model endpoint; skipped unless CUE_LIVE_AGENT=1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
